<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Boda</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f7f3ea;
            color: #28483d;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
        }

        .leaves {
            font-size: 45px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            margin: 10px;
        }

        .date {
            font-size: 20px;
            letter-spacing: 4px;
            margin: 20px;
        }

        .message {
            font-size: 18px;
            font-style: italic;
        }

        .button {
            margin-top: 30px;
            padding: 14px 30px;
            border: 1px solid #9c8050;
            color: #28483d;
            text-decoration: none;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="leaves">
            🌿
        </div>

        <p>CON MUCHO AMOR</p>

        <h1>Yoselin &amp; ______</h1>

        <div class="date">
            14 · 02 · 2027
        </div>

        <p class="message">
            Nos encantaría compartir este día tan especial contigo.
        </p>

        <a href="#invitacion" class="button">
            NUESTRA HISTORIA
        </a>

    </section>

</body>
</html>
